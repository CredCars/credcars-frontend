name: Deploy Frontend to AWS S3 + CloudFront

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # --- Environment file handling ---
      - name: Use production env
        if: github.ref == 'refs/heads/main'
        run: cp .env.production .env

      - name: Use staging env
        if: github.ref == 'refs/heads/staging'
        run: cp .env.staging .env

      # --- Build ---
      - name: Build Vue app
        run: npm run build

      # --- Deploy to S3 ---
      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
          bucket: ${{ github.ref == 'refs/heads/main' && vars.PROD_S3_BUCKET || vars.STAGING_S3_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          source: ./build
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}

      # --- Configure AWS credentials ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # --- Invalidate CloudFront cache ---
      - name: Invalidate CloudFront cache
        uses: chetan/invalidate-cloudfront-action@v2
        with:
          distribution-id: ${{ github.ref == 'refs/heads/main' && vars.PROD_CLOUDFRONT_DISTRIBUTION_ID || vars.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
          paths: '/*'
